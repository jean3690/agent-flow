server:
  port: ${SERVER_PORT:8084}
  tomcat:
    connection-timeout: 120000

spring:
  application:
    name: agent-flow-java
  config:
    # allows `cp .env.example .env` to work without exporting variables manually
    import: "optional:file:.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 0
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:agent-flow-java}

agentflow:
  jwt:
    secret: ${JWT_SECRET:agent-flow-local-secret-key-please-change}
    expire-hours: ${JWT_EXPIRE_HOURS:12}
  auth:
    default-username: ${APP_AUTH_DEFAULT_USERNAME:admin}
    default-password: ${APP_AUTH_DEFAULT_PASSWORD:admin123}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:120000}
    connect-timeout-ms: 5000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  internal:
    token: ${AI_INTERNAL_TOKEN:agent-flow-internal}
  crypto:
    # 服务商 Key 落库加密密钥；更换后旧密文将无法解密，请保持稳定
    key: ${CRYPTO_KEY:agent-flow-local-crypto-key}
  pricing:
    # 每 1K token 的估算单价（美元）；仅用于成本统计，不参与计费
    default-input-per-1k: 0
    default-output-per-1k: 0
    models:
      gpt-4o-mini:
        input-per-1k: 0.00015
        output-per-1k: 0.0006
      gpt-4o:
        input-per-1k: 0.0025
        output-per-1k: 0.01
      deepseek-chat:
        input-per-1k: 0.00027
        output-per-1k: 0.0011
      qwen-plus:
        input-per-1k: 0.0004
        output-per-1k: 0.0012
      glm-4:
        input-per-1k: 0.00014
        output-per-1k: 0.00014
      agentflow-mock:
        input-per-1k: 0
        output-per-1k: 0

logging:
  pattern:
    level: "%5p [runId:%X{runId:-}]"
  level:
    com.agentflow: INFO
