spring:
  datasource:
    # file based so workflows survive restarts; delete ./data to reset
    url: jdbc:h2:file:./data/agentflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
