services:
  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_MOCK_MODE: ${AI_MOCK_MODE:-auto}
      AI_CORS_ORIGINS: "*"
      AI_JAVA_SERVICE_BASE_URL: http://java-service:8084
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-agent-flow-internal}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    volumes:
      - ai-data:/srv/data

  java-service:
    build: ./java-service
    restart: unless-stopped
    depends_on:
      - ai-service
    environment:
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-agent-flow-internal}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-agent-flow-local-secret-key-please-change}
    volumes:
      - java-data:/app/data
    ports:
      - "8084:8084"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - java-service
    ports:
      - "8080:80"

volumes:
  ai-data:
  java-data:
