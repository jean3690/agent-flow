services:
  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_MOCK_MODE: ${AI_MOCK_MODE:-auto}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-8}
      AI_EVENT_BUFFER_MAX_EVENTS: ${AI_EVENT_BUFFER_MAX_EVENTS:-256}
      AI_EVENT_BUFFER_MAX_BYTES: ${AI_EVENT_BUFFER_MAX_BYTES:-4194304}
      AI_EVENT_MAX_BYTES: ${AI_EVENT_MAX_BYTES:-1048576}
      AI_EVENT_HEARTBEAT_SECONDS: ${AI_EVENT_HEARTBEAT_SECONDS:-15}
      AI_CORS_ORIGINS: "*"
      AI_PLATFORM_SERVICE_BASE_URL: http://platform-service:8084
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-agent-flow-internal}
      AI_MANAGED_SKILLS_DIR: /srv/data/skills
      AI_MCP_PRIVATE_HOSTS: ${AI_MCP_PRIVATE_HOSTS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AI_DASHSCOPE_API_HOST: ${DASHSCOPE_API_HOST:-}
    volumes:
      - ai-data:/srv/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  platform-service:
    build: ./platform-service
    restart: unless-stopped
    depends_on:
      ai-service:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////srv/data/agentflow.db}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-agent-flow-internal}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-agent-flow-local-secret-key-please-change}
      CRYPTO_KEY: ${CRYPTO_KEY:-agent-flow-local-crypto-key}
      APP_AUTH_DEFAULT_USERNAME: ${APP_AUTH_DEFAULT_USERNAME:-admin}
      APP_AUTH_DEFAULT_PASSWORD: ${APP_AUTH_DEFAULT_PASSWORD:-admin123}
      EXECUTION_CORE_POOL_SIZE: ${EXECUTION_CORE_POOL_SIZE:-4}
      EXECUTION_MAX_POOL_SIZE: ${EXECUTION_MAX_POOL_SIZE:-32}
      EXECUTION_QUEUE_CAPACITY: ${EXECUTION_QUEUE_CAPACITY:-200}
      EXECUTION_TRANSPORT_GRACE_MS: ${EXECUTION_TRANSPORT_GRACE_MS:-5000}
      EXECUTION_MAX_EVENT_CHARS: ${EXECUTION_MAX_EVENT_CHARS:-2000000}
    volumes:
      - platform-data:/srv/data
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8084/actuator/health/readiness', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      platform-service:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  ai-data:
  platform-data:
