[project]
name = "agent-flow-ai"
version = "0.1.0"
description = "AgentFlow AI service: LangGraph workflow runtime on FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
  "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]
prod = ["gunicorn>=22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
