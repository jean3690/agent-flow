name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: 单元测试与构建
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Python 测试与覆盖率
        working-directory: ai-service
        run: |
          pip install -e ".[dev]"
          python -m pytest -q --cov=app --cov-report=term --cov-fail-under=70

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Java 测试与覆盖率
        working-directory: java-service
        run: mvn -q test
      # jacoco 的 prepare-agent / report / check 绑定在 test 阶段，
      # test 通过即代表行覆盖率不低于 40%（低于门槛会直接让构建失败）。

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端单元测试、类型检查与构建
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            java-service/target/site/jacoco
          if-no-files-found: ignore

  sdk:
    name: 官方 SDK 测试
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python SDK 测试
        working-directory: sdk/python
        run: |
          pip install -e ".[dev]"
          python -m pytest -q
          pip wheel --no-deps --wheel-dir dist .
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              assert 'agentflow/resources/mcp.py' in wheel.namelist()
              assert 'agentflow/resources/skills.py' in wheel.namelist()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: TypeScript SDK 测试
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test
          npm run build
          node --input-type=module -e "import { AgentFlowClient } from 'agentflow-sdk'; const c = new AgentFlowClient('http://test'); if (typeof c.mcp.discover !== 'function' || typeof c.skills.save !== 'function') process.exit(1)"
          npm pack --dry-run

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Java SDK 测试与构建
        working-directory: sdk/java
        run: mvn -q verify

  e2e:
    name: 端到端冒烟
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: 启动 ai-service
        working-directory: ai-service
        run: |
          pip install -e .
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 启动 java-service
        working-directory: java-service
        run: |
          mvn -q -DskipTests spring-boot:run &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8084/api/system/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8084/api/system/health

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 前端隔离回归
        working-directory: frontend
        run: npm run test:ui

      - name: 后端冒烟
        run: python3 e2e/smoke.py

      - name: 服务接入冒烟
        run: python3 e2e/verify_service.py

      - name: 前端 UI 冒烟 (Playwright)
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 5173 --host 127.0.0.1 &
          DEV_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5173/
          npm run test:e2e
          kill $DEV_PID 2>/dev/null || true