name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: 单元测试与构建
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Python 测试
        working-directory: ai-service
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Java 测试
        working-directory: java-service
        run: mvn -q test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端类型检查与构建
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

  e2e:
    name: 端到端冒烟
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: 启动 ai-service
        working-directory: ai-service
        run: |
          pip install -e .
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 启动 java-service
        working-directory: java-service
        run: |
          mvn -q -DskipTests spring-boot:run &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8084/api/system/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8084/api/system/health

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 启动前端 (dev)
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5173/

      - name: 后端冒烟
        run: python3 e2e/smoke.py

      - name: 前端 UI 冒烟 (Playwright)
        working-directory: frontend
        run: npm run test:e2e
