[project]
name = "agentflow-sdk"
version = "0.1.0"
description = "Python SDK for the Agent Flow workflow orchestration service"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
