name: agent-flow

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-agentflow123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_flow}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - agent-flow-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - agent-flow-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 兼容对象存储。默认使用本机已有的 RustFS 镜像；
  # 如能拉取 MinIO，可将 image 换成 minio/minio 并把环境变量改为 MINIO_ROOT_USER/PASSWORD。
  storage:
    image: ${OBJECT_STORAGE_IMAGE:-rustfs/rustfs:latest}
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_OBS_ENVIRONMENT: production
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - agent-flow-storage:/data

  backend:
    build:
      context: ..
      dockerfile: python-backend/Dockerfile
    environment:
      SERVER_PORT: 8084
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_flow}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-agentflow123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://storage:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-agent-flow}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:19000}
      JWT_SECRET: ${JWT_SECRET:-agentflow-docker-jwt-secret-change-me-0123456789abcdef0123456789abcdef}
      APP_AUTH_DEFAULT_USERNAME: ${APP_AUTH_DEFAULT_USERNAME:-admin}
      APP_AUTH_DEFAULT_PASSWORD: ${APP_AUTH_DEFAULT_PASSWORD:-admin123}
      AGENTFLOW_AUTO_MIGRATE: "true"
      AGENTFLOW_SCHEMA_SQL: /app/schema.sql
      TZ: Asia/Shanghai
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  frontend:
    profiles: ["full"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent-flow-mysql:
  agent-flow-redis:
  agent-flow-storage:
