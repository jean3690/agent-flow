          - paragraph [ref=e241]: 会员等级规则：普通会员累计消费满 500 元升级为银卡会员，满 2000 元升级为金卡会员，满 5000 元升级为黑卡会员。等级每自然年重新计算一次，降级前会提前 30 天短信通知。 积分获取：每消费 1 元累计 1 积分，金卡会员享受 1.5 倍积分，黑卡会员享受 2 倍积分。积分在订单完成后 7 天入账，退货订单会扣回对应积分。
        - generic [ref=e242]:
