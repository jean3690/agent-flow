          - paragraph [ref=e244]: 会员享受 2 倍积分。积分在订单完成后 7 天入账，退货订单会扣回对应积分。 积分使用：100 积分可抵扣 1 元，单笔订单最多抵扣订单金额的 30%。积分有效期为 24 个月，过期未使用自动清零，清零前可在会员中心查看即将过期的积分。 生日权益：银卡及以上会员在生日当月可领取一张 20 元无门槛券，黑卡会员额外获得一次免运费权益。权益需在生日当月内领取，过期不补发。
