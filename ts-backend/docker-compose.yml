name: agent-flow-ts

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-agentflow123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_flow}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "13307:3306"
    volumes:
      - agent-flow-ts-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "16380:6379"
    volumes:
      - agent-flow-ts-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: ${OBJECT_STORAGE_IMAGE:-rustfs/rustfs:latest}
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_OBS_ENVIRONMENT: production
    ports:
      - "19002:9000"
      - "19003:9001"
    volumes:
      - agent-flow-ts-storage:/data

  backend:
    build:
      context: ..
      dockerfile: ts-backend/Dockerfile
    environment:
      SERVER_PORT: 8084
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_flow}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-agentflow123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://storage:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-agent-flow}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:19002}
      JWT_SECRET: ${JWT_SECRET:-agentflow-ts-docker-jwt-secret-change-me-0123456789abcdef0123456789abcdef}
      APP_AUTH_DEFAULT_USERNAME: ${APP_AUTH_DEFAULT_USERNAME:-admin}
      APP_AUTH_DEFAULT_PASSWORD: ${APP_AUTH_DEFAULT_PASSWORD:-admin123}
      AGENTFLOW_AUTO_MIGRATE: "true"
      TZ: Asia/Shanghai
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8084/api/node-types >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    profiles: ["full"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  agent-flow-ts-mysql:
  agent-flow-ts-redis:
  agent-flow-ts-storage:
